name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: procesoimagen
          POSTGRES_PASSWORD: procesoimagen
          POSTGRES_DB: procesoimagen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procesoimagen -d procesoimagen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://procesoimagen:procesoimagen@localhost:5432/procesoimagen
      DATABASE_URL_TEST: postgresql+psycopg://procesoimagen:procesoimagen@localhost:5432/procesoimagen
      STORAGE_PATH: /tmp/procesoimagen-storage
      DATASET_PATH: /tmp/procesoimagen-dataset

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libheif1

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Alembic upgrade
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q
