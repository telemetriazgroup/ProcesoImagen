services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: procesoimagen
      POSTGRES_PASSWORD: procesoimagen
      POSTGRES_DB: procesoimagen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procesoimagen -d procesoimagen"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://procesoimagen:procesoimagen@db:5432/procesoimagen
      STORAGE_PATH: /app/storage
    volumes:
      - ./backend/app:/app/app
      - ./storage:/app/storage
      - ./dataset:/app/dataset
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
